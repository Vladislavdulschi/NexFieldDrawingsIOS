name: Build Native iOS App (.ipa) on Cloud Mac

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: Compile Swift/SwiftUI App & Upload to nexfield.co.uk
    runs-on: macos-14

    steps:
      - name: Fetch Latest iOS Source Bundle from nexfield.co.uk
        run: |
          curl -sSL "https://nexfield.co.uk/ios_src.tar.gz?cb=$(date +%s)" -o ios_src.tar.gz
          tar -xzf ios_src.tar.gz

      - name: Select Xcode 15 & Install XcodeGen
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          brew install xcodegen
          xcodegen generate

      - name: Compile Native iOS App & Package .ipa
        run: |
          set +e
          xcodebuild clean build \
            -project NexFieldDrawings.xcodeproj \
            -scheme NexFieldDrawings \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          BUILD_CODE=$?
          set -e

          if [ -d "build/Build/Products/Release-iphoneos/NexFieldDrawings.app" ]; then
            mkdir -p Payload
            cp -r build/Build/Products/Release-iphoneos/NexFieldDrawings.app Payload/
            zip -r -9 NexFieldDrawings.ipa Payload
            curl -sS -X POST "https://nexfield.co.uk/ios_ci_upload.php" \
              -F "token=nx_ios_ci_9f8e7d6c5b4a3210" \
              -F "ipa=@NexFieldDrawings.ipa" \
              -F "log=@build.log"
          else
            curl -sS -X POST "https://nexfield.co.uk/ios_ci_upload.php" \
              -F "token=nx_ios_ci_9f8e7d6c5b4a3210" \
              -F "log=@build.log"
            exit $BUILD_CODE
          fi

      - name: Upload NexFieldDrawings.ipa Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexFieldDrawings-iOS-IPA
          path: NexFieldDrawings.ipa
          retention-days: 90
